<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/index.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8BBB92"/><stop offset="1" stop-color="#2A835F"/></linearGradient></defs><path fill="url(#g)" d="M11.6 2.2 2.2 11.6a.6.6 0 0 0 0 .8l9.4 9.4a.6.6 0 0 0 .8 0l9.4-9.4a.6.6 0 0 0 0-.8L12.4 2.2a.6.6 0 0 0-.8 0Zm.4 13.5L8.3 12 12 8.3l3.7 3.7L12 15.7Z"/></svg>
      <span>TaskFlow</span>
    </div>
    <nav class="topnav">
      <button class="topnav-item" data-nav="projects">Projects</button>
      <button class="topnav-item" data-nav="mcp">Connect Claude</button>
    </nav>
    <button class="btn btn-primary" id="createBtn">Create</button>
    <div class="spacer"></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M16.4 15 21 19.6 19.6 21 15 16.4A8 8 0 1 1 16.4 15ZM10 16a6 6 0 1 0 0-12 6 6 0 0 0 0 12Z"/></svg>
      <input id="globalSearch" placeholder="Search issues  ( / )" autocomplete="off" />
      <div class="search-results hidden" id="searchResults"></div>
    </div>
    <div class="live-dot" title="Live: changes made by Claude via MCP appear instantly"></div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal" id="modal"></div></div>
  <div class="toasts" id="toasts"></div>

  <script src="integrations.js"></script>
  <script src="documents.js"></script>
  <script src="app.js"></script>
</body>
</html>
